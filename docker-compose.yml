services:
  apache:
    image: httpd:2.4
    container_name: momo_apache
    ports:
      - "8081:80" 
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks: [momo]
  
  # ------------------------------------------------------------------
  # Nœud 1 : Redis + Sentinel
  # ------------------------------------------------------------------
  redis_node1:
    image: redis/redis-stack-server:7.4.0-v1
    command: >
      sh -c "
      redis-server /etc/redis/redis-conf/redis.conf &
      redis-sentinel /etc/redis/redis-conf/sentinel.conf --sentinel
      "
    volumes:
      - ./config/master/:/etc/redis/redis-conf/
      - redis1_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-momo2026} PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "6379:6379"
      - "26379:26379"
    networks: [momo]

  # ------------------------------------------------------------------
  # Nœud 2 : Redis + Sentinel
  # ------------------------------------------------------------------
  redis_node2:
    image: redis/redis-stack-server:7.4.0-v1
    command: >
      sh -c "
      redis-server /etc/redis/redis-conf/redis.conf &
      redis-sentinel /etc/redis/redis-conf/sentinel.conf --sentinel
      "
    volumes:
      - ./config/slave2:/etc/redis/redis-conf
      - redis2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-momo2026} PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "6380:6379"
      - "26380:26379"
    networks: [momo]

  # ------------------------------------------------------------------
  # Nœud 3 : Redis + Sentinel
  # ------------------------------------------------------------------
  redis_node3:
    image: redis/redis-stack-server:7.4.0-v1
    command: >
      sh -c "
      redis-server /etc/redis/redis-conf/redis.conf &
      redis-sentinel /etc/redis/redis-conf/sentinel.conf --sentinel
      "
    volumes:
      - ./config/slave3:/etc/redis/redis-conf
      - redis3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-momo2026} PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "6381:6379"
      - "26381:26379"
    networks: [momo]

  # ------------------------------------------------------------------
  # PostgreSQL et tes applis restent inchangés
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: momo_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momo}
      POSTGRES_USER: ${POSTGRES_USER:-momo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momo2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [momo]

  web1: &web
    build: ./app
    container_name: momo_web1
    environment: &web_env
      NOM_INSTANCE: web1
      REDIS_SENTINELS: redis_node1:26379,redis_node2:26379,redis_node3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD:-momo2026}
      #REDIS_URL: redis://:${REDIS_PASSWORD:-momo2026}@redis_node1:26379/0
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-momo}
      POSTGRES_USER: ${POSTGRES_USER:-momo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momo2026}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cle-de-demonstration-a-remplacer}
      DJANGO_DEBUG: "0"
    depends_on:
      redis_node1:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py init_redis
        exec gunicorn config.wsgi:application \
          --bind=0.0.0.0:8000 \
          --workers=4 \
          --worker-class=gthread \
          --threads=8 \
          --access-logfile=- \
          --log-level=debug
    networks: [momo]

  web2:
    <<: *web
    container_name: momo_web2
    environment:
      <<: *web_env
      NOM_INSTANCE: web2

  web3:
    <<: *web
    container_name: momo_web3
    environment:
      <<: *web_env
      NOM_INSTANCE: web3

  worker:
    build: ./app
    container_name: momo_worker
    environment:
      <<: *web_env
      NOM_INSTANCE: worker1
    depends_on:
      redis_node1:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: python manage.py consume_stream --nom worker1
    networks: [momo]

volumes:
  redis1_data:
  redis2_data:
  redis3_data:
  pg_data:

networks:
  momo:
    driver: bridge
