# Apache en reverse proxy et repartiteur de charge round robin.
#
# Le round robin est le comportement par defaut de mod_proxy_balancer
# lorsque aucun lbmethod n'est precise. On l'ecrit tout de meme
# explicitement pour que le fichier documente l'intention.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName momo-lb

LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule headers_module        modules/mod_headers.so
LoadModule proxy_module          modules/mod_proxy.so
LoadModule proxy_http_module     modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module    modules/mod_slotmem_shm.so
LoadModule status_module         modules/mod_status.so

User daemon
Group daemon

<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Le nom de l'instance qui a traite la requete remonte au client.
# C'est ce qui permet de montrer la repartition en direct pendant la demo.
LogFormat "%h %t \"%r\" %>s %b %{X-Instance}o %Dus" momo
CustomLog /proc/self/fd/1 momo
ErrorLog /proc/self/fd/2
LogLevel warn

<Proxy balancer://django>
    BalancerMember http://web1:8000 route=web1 retry=5
    BalancerMember http://web2:8000 route=web2 retry=5
    BalancerMember http://web3:8000 route=web3 retry=5

    # Repartition stricte, une requete par membre a tour de role.
    ProxySet lbmethod=byrequests

    # Une instance qui ne repond plus est sortie du pool puis reessayee.
    # C'est la brique de haute disponibilite a montrer en demonstration.
    ProxySet failontimeout=On
</Proxy>

ProxyPreserveHost On
ProxyTimeout 10

# La console de supervision du repartiteur, utile pendant la soutenance.
<Location /balancer-manager>
    SetHandler balancer-manager
    Require all granted
</Location>

ProxyPass        /balancer-manager !
ProxyPass        / balancer://django/
ProxyPassReverse / balancer://django/
