# Configuration Redis pour le moteur de scoring.
# Chaque directive est commentee, le rapport reprend ces choix en Partie 1.

bind 0.0.0.0
protected-mode no
port 6379

requirepass "momo2026"
masterauth "momo2026"
replicaof redis_node1 6379

# --- Persistance -------------------------------------------------------
# AOF avec fsync a la seconde : compromis retenu entre durabilite et debit.
# En mode always, le fsync a chaque ecriture ferait chuter le debit sous les
# 1 000 operations par seconde et rendrait le budget de 20 ms intenable.
# En mode no, on perdrait potentiellement 30 secondes d'ecritures.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Instantanes RDB conserves en complement, pour la reprise rapide.
save 900 1
save 300 10
save 60 10000

# --- Memoire -----------------------------------------------------------
# Volontairement dimensionne pour la demonstration.
maxmemory 512mb

# Les compteurs de scoring portent tous un TTL. En cas de saturation, on
# evince en priorite ce qui expire deja, jamais une cle sans expiration
# comme le filtre de Bloom ou le referentiel des regles.
maxmemory-policy volatile-ttl

# --- Journalisation ----------------------------------------------------
# Toute commande depassant 10 ms est tracee. Sur un moteur mono-thread,
# une commande lente bloque toutes les autres : c'est le premier endroit
# ou regarder quand la latence derape.
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100

# --- Encodages internes ------------------------------------------------
# En dessous de ces seuils, Redis stocke les structures sous forme compacte
# (listpack) plutot qu'en table de hachage ou en skiplist. Gain memoire
# important sur les petits objets, au prix d'un acces lineaire.
hash-max-listpack-entries 128
hash-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
set-max-intset-entries 512

# --- Modules -----------------------------------------------------------
# Redis Stack charge RedisBloom et RedisTimeSeries automatiquement.

loadmodule /opt/redis-stack/lib/redisbloom.so
loadmodule /opt/redis-stack/lib/redistimeseries.so
loadmodule /opt/redis-stack/lib/rejson.so
loadmodule /opt/redis-stack/lib/redisearch.so

# 2. Set the verbosity level (options: debug, verbose, notice, warning)
loglevel notice
enable-debug-command local
